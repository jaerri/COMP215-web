<!DOCTYPE html>
<html>
    <head>
        <title>tables and lists</title>
        <style>
            table, td {
                border: 1px black solid;
            }
            table {
                margin-block: 0.2em;
                border-collapse: collapse;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td>cell 1.1</td>
                <td>cell 1.2</td>
                <td>cell 1.3</td>
            </tr>
            <tr>
                <td>cell 2.1</td>
                <td>cell 2.2</td>
                <td>cell 2.3</td>
            </tr>
            <tr>
                <td>cell 3.1</td>
                <td>cell 3.2</td>
                <td>cell 3.3</td>
            </tr>
        </table>
        <table>
            <tr>
                <td>cell 1.1</td>
                <td rowspan="3">cell *.2</td>
                <td>cell 1.3</td>
            </tr>
            <tr>
                <td>cell 2.1</td>
                <td>cell 2.3</td>
            </tr>
            <tr>
                <td>cell 3.1</td>
                <td>cell 3.3</td>
            </tr>
        </table>
        <table>
            <tr>
                <td colspan="2">cell 1</td>
            </tr>
            <tr>
                <td colspan="2">cell 2</td>
            </tr>
            <tr>
                <td>cell 3.1</td>
                <td>cell 3.3</td>
            </tr>
        </table>
        <ul>
            <li>item 1</li>
            <li>item 2</li>
            <li>item 3</li>
        </ul>
        <ol>
            <li>item 1</li>
            <li>item 2</li>
            <li>item 3</li>
        </ol>
    </body>
</html>
