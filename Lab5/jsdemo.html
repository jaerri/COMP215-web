<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <style>
        #floatingForm {
            top: 100px;
            left: 230px;
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #formGrid {
            border: dashed blue;
            padding: 1em;
            display: grid;
            grid-template: 1fr 1fr / auto 1fr;
            & input[type=button] {
                justify-self: start;
            }
            margin-bottom: 1em;
        }
        #formController {
            position: absolute;
            top: 250px;
            left: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1em;
            border: 2px solid blue;
        }
        #formControllerGrid {
            display: inline-grid;
            grid-template: 1fr 1fr / 1fr auto 1fr;
        }
        #buttonHide {
            background-color: darkkhaki;
        }
    </style>
</head>

<body>
    <h2><a href="../index.html">JS intro</a></h2>
    <form name="testform" id="floatingForm">
        <div id="formGrid">
            <input type="button" id="buttonCheck" value="Check Text">
            <input type="text" id="inputCheck" placeholder="Type here">
            <input type="button" id="buttonGoto" value="Go to">
            <input type="text" id="inputGoto" placeholder="Type here">
            <input type="button" id="buttonBrowser" value="My browser is">
            <input type="text" inert="true" id="textBrowser">
        </div>
    </form>
    <div id="formController">
        <h5>Form controller</h5>
        <div id="formControllerGrid">
            <div></div>
            <input type="button" id="buttonUp" value="Up">
            <div></div>
            <input type="button" id="buttonLeft" value="Left">
            <input type="button" id="buttonHide" value="Toggle hide">
            <input type="button" id="buttonRight" value="Right">
            <div></div>
            <input type="button" id="buttonDown" value="Down">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="jsdemo.js"></script>
</body>

</html>
